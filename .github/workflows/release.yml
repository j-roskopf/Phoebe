name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional custom version (e.g. 1.2.3). If omitted, uses auto-increment and timestamp.
        required: false
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  version:
    name: Validate and bump version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and bump version
        id: version
        shell: bash
        run: |
          version="$(grep '^phoebe.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          configured_version_code="$(grep '^phoebe.versionCode=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]' || true)"
          
          if [[ -z "${version}" ]]; then
            echo "::error::gradle.properties must define phoebe.versionName"
            exit 1
          fi
          if [[ -z "${configured_version_code}" ]]; then
            echo "::error::gradle.properties must define phoebe.versionCode"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            new_version_name="${{ inputs.version }}"
            new_version_code=$((configured_version_code + 1))
          else
            new_version_code=$((configured_version_code + 1))
            new_version_name=$(date -u +"%Y.%m%d.%H%M")
          fi

          if [[ ! "${new_version_name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version name must be plain semver (like 1.2.3 or YYYY.MMDD.HHMM)"
            exit 1
          fi

          echo "Bumping version code from ${configured_version_code} to ${new_version_code}"
          echo "Bumping version name from ${version} to ${new_version_name}"

          perl -pi -e "s/^phoebe.versionCode=.*/phoebe.versionCode=${new_version_code}/" gradle.properties
          perl -pi -e "s/^phoebe.versionName=.*/phoebe.versionName=${new_version_name}/" gradle.properties

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add gradle.properties
          git commit -m "Bump version to ${new_version_name} (code: ${new_version_code}) [skip ci]"
          
          if ! git push origin HEAD:main; then
            echo "::error::Failed to push version bump to main branch. This usually happens because of branch protection rules on 'main'. Please configure branch protection bypass or use a PAT."
            exit 1
          fi

          tag_name="release/${new_version_name}"
          git tag "${tag_name}"
          git push origin "${tag_name}"

          {
            echo "version=${new_version_name}"
            echo "version_code=${new_version_code}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

  android:
    name: Android release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android signing secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "${ANDROID_KEYSTORE_PASSWORD}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "${ANDROID_KEY_ALIAS}" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "${ANDROID_KEY_PASSWORD}" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "${PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY}" ]] || missing+=("PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure Android signing
        shell: bash
        run: |
          keystore_path="${RUNNER_TEMP}/phoebe-release.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          {
            echo "PHOEBE_ANDROID_SIGNING_STORE_FILE=${keystore_path}"
            echo "PHOEBE_ANDROID_SIGNING_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK and bundle
        run: >
          ./gradlew
          :androidApp:assembleRelease
          :androidApp:bundleRelease
          -Pphoebe.versionName=${{ needs.version.outputs.version }}
          -Pphoebe.versionCode=${{ needs.version.outputs.version_code }}

      - name: Collect Android release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          apk="$(find androidApp/build/outputs/apk/release -name '*.apk' -print -quit)"
          aab="$(find androidApp/build/outputs/bundle/release -name '*.aab' -print -quit)"
          if [[ -z "${apk}" || -z "${aab}" ]]; then
            echo "::error::Could not find Android APK and AAB release artifacts"
            exit 1
          fi
          cp "${apk}" "release-artifacts/Phoebe-${VERSION}.apk"
          cp "${aab}" "release-artifacts/Phoebe-${VERSION}.aab"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: release-artifacts/*

  linux:
    name: Linux release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Linux release secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY}" ]] || missing+=("PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Linux release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build Linux package
        run: >
          ./gradlew
          :composeApp:packageReleaseDeb
          :composeApp:createReleaseDistributable
          -Pphoebe.versionName=${{ needs.version.outputs.version }}

      - name: Build Linux Flatpak bundle
        shell: bash
        run: |
          mkdir -p release-artifacts
          (
            cd composeApp/flatpak
            flatpak-builder \
              --force-clean \
              --repo="${GITHUB_WORKSPACE}/flatpak-repo" \
              "${GITHUB_WORKSPACE}/flatpak-build" \
              com.phoebe.app.yml
          )
          flatpak build-bundle \
            flatpak-repo \
            "release-artifacts/Phoebe-${VERSION}.flatpak" \
            com.phoebe.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Collect Linux release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          deb="$(find composeApp/build -name '*.deb' -print -quit)"
          if [[ -z "${deb}" ]]; then
            echo "::error::Could not find Linux DEB release artifact"
            exit 1
          fi
          flatpak_bundle="release-artifacts/Phoebe-${VERSION}.flatpak"
          if [[ ! -f "${flatpak_bundle}" ]]; then
            echo "::error::Could not find Linux Flatpak release artifact"
            exit 1
          fi
          cp "${deb}" "release-artifacts/Phoebe-${VERSION}.deb"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: release-artifacts/*

  windows:
    name: Windows release
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Azure Artifact Signing settings
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:AZURE_CLIENT_ID) { $missing += "AZURE_CLIENT_ID" }
          if (-not $env:AZURE_TENANT_ID) { $missing += "AZURE_TENANT_ID" }
          if (-not $env:AZURE_SIGNING_ENDPOINT) { $missing += "AZURE_SIGNING_ENDPOINT" }
          if (-not $env:AZURE_SIGNING_ACCOUNT_NAME) { $missing += "AZURE_SIGNING_ACCOUNT_NAME" }
          if (-not $env:AZURE_SIGNING_CERTIFICATE_PROFILE_NAME) { $missing += "AZURE_SIGNING_CERTIFICATE_PROFILE_NAME" }
          if (-not $env:PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY) { $missing += "PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required Windows release secrets: $($missing -join ', ')"
            exit 1
          }

      - name: Build Windows package
        shell: pwsh
        run: >
          ./gradlew
          :composeApp:packageReleaseMsi
          "-Pphoebe.versionName=${{ needs.version.outputs.version }}"

      - name: Collect Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          $msi = Get-ChildItem -Path "composeApp/build" -Recurse -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Could not find Windows MSI release artifact"
          }
          Copy-Item $msi.FullName "release-artifacts/Phoebe-${env:VERSION}.msi"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Ensure PowerShell Gallery is registered
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $repository = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
              if (-not $repository) {
                Register-PSRepository -Default
              }

              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Get-PSRepository -Name PSGallery
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }

              Write-Warning "Failed to configure PSGallery on attempt $attempt of $maxAttempts. Retrying in 10 seconds. $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release-artifacts
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: release-artifacts/*

  macos:
    name: macOS release
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch test audio fixtures
        shell: bash
        run: ./scripts/fetch-test-audio.sh

      - name: Validate macOS signing secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${MACOS_CERTIFICATE_BASE64}" ]] || missing+=("MACOS_CERTIFICATE_BASE64")
          [[ -n "${MACOS_CERTIFICATE_PASSWORD}" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "${MACOS_DEVELOPER_IDENTITY}" ]] || missing+=("MACOS_DEVELOPER_IDENTITY")
          [[ -n "${MACOS_KEYCHAIN_PASSWORD}" ]] || missing+=("MACOS_KEYCHAIN_PASSWORD")
          [[ -n "${APPLE_ID}" ]] || missing+=("APPLE_ID")
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=("APPLE_TEAM_ID")
          [[ -n "${PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY}" ]] || missing+=("PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required macOS release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import macOS signing certificate
        id: macos_identity
        shell: bash
        run: |
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          echo "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${cert_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"

          jpackage_signing_identity="${MACOS_DEVELOPER_IDENTITY#Developer ID Application: }"
          jpackage_signing_identity="${jpackage_signing_identity#Developer ID Installer: }"
          jpackage_signing_identity="${jpackage_signing_identity#3rd Party Mac Developer Application: }"
          jpackage_signing_identity="${jpackage_signing_identity#3rd Party Mac Developer Installer: }"
          identity_list="$(security find-identity -v "${keychain_path}")"
          if ! grep -Fq "Developer ID Application: ${jpackage_signing_identity}" <<< "${identity_list}"; then
            echo "::error::MACOS_CERTIFICATE_BASE64 must include the Developer ID Application identity named by MACOS_DEVELOPER_IDENTITY"
            exit 1
          fi
          has_installer_identity=false
          if ! grep -Fq "Developer ID Installer: ${jpackage_signing_identity}" <<< "${identity_list}"; then
            echo "::notice::MACOS_CERTIFICATE_BASE64 does not include the matching Developer ID Installer identity; skipping PKG packaging."
          else
            has_installer_identity=true
          fi
          echo "has_installer_identity=${has_installer_identity}" >> "${GITHUB_OUTPUT}"

          {
            echo "compose.desktop.mac.sign=true"
            echo "compose.desktop.mac.signing.identity=${jpackage_signing_identity}"
            echo "compose.desktop.mac.signing.keychain=${keychain_path}"
          } >> "${HOME}/.gradle/gradle.properties"

      - name: Build macOS package
        shell: bash
        run: |
          tasks=(":composeApp:packageReleaseDmg")
          if [[ "${HAS_INSTALLER_IDENTITY}" == "true" ]]; then
            tasks+=(":composeApp:packageReleasePkg")
          fi
          ./gradlew "${tasks[@]}" -Pphoebe.versionName=${{ needs.version.outputs.version }}
        env:
          HAS_INSTALLER_IDENTITY: ${{ steps.macos_identity.outputs.has_installer_identity }}

      - name: Print macOS packaging logs
        if: failure()
        shell: bash
        run: |
          log_dir="composeApp/build/compose/logs"
          if [[ ! -d "${log_dir}" ]]; then
            echo "No Compose packaging logs found."
            exit 0
          fi

          while IFS= read -r log_file; do
            echo "::group::${log_file}"
            sed -n '1,240p' "${log_file}"
            echo "::endgroup::"
          done < <(find "${log_dir}" -type f -name 'jpackage-*.txt' | sort)

      - name: Notarize macOS package
        shell: bash
        run: |
          mac_artifacts=()
          while IFS= read -r artifact; do
            mac_artifacts+=("${artifact}")
          done < <(find composeApp/build \( -name '*.dmg' -o -name '*.pkg' \) -print | sort)
          if (( ${#mac_artifacts[@]} == 0 )); then
            echo "::error::Could not find macOS artifacts to notarize"
            exit 1
          fi
          for artifact in "${mac_artifacts[@]}"; do
            xcrun notarytool submit "${artifact}" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --wait
            xcrun stapler staple "${artifact}"
          done

      - name: Smoke test notarized macOS DMG playback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          dmg="$(find composeApp/build -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "::error::Could not find macOS DMG artifact"
            exit 1
          fi
          fixture="${PWD}/composeApp/src/commonTest/resources/test-audio/wikimedia-example.ogg"
          if [[ ! -f "${fixture}" ]]; then
            echo "::error::Missing playback smoke fixture: ${fixture}"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "${mount_dir}" -quiet || true
            rmdir "${mount_dir}" || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmg}" -mountpoint "${mount_dir}" -nobrowse -quiet
          app_path="$(find "${mount_dir}" -maxdepth 2 -name 'Phoebe.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "::error::Could not find Phoebe.app in mounted DMG"
            exit 1
          fi
          "${app_path}/Contents/MacOS/Phoebe" \
            "--phoebe-playback-smoke=${fixture}" \
            --phoebe-playback-smoke-timeout-ms=20000 \
            2>&1 | tee smoke-logs/macos-dmg-playback.log

      - name: Collect macOS release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          dmg="$(find composeApp/build -name '*.dmg' -print -quit)"
          pkg="$(find composeApp/build -name '*.pkg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "::error::Could not find macOS DMG release artifact"
            exit 1
          fi
          cp "${dmg}" "release-artifacts/Phoebe-${VERSION}.dmg"
          if [[ -n "${pkg}" ]]; then
            cp "${pkg}" "release-artifacts/Phoebe-${VERSION}.pkg"
          else
            echo "::notice::No macOS PKG release artifact was built."
          fi
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: release-artifacts/*

  ios:
    name: iOS release
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      PHOEBE_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_IOS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate iOS release secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${PHOEBE_GOOGLE_MAPS_IOS_API_KEY}" ]] || missing+=("PHOEBE_GOOGLE_MAPS_IOS_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required iOS release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install Google Cast SDK for iOS
        shell: bash
        run: ./scripts/install-ios-google-cast-sdk.sh

      - name: Update iOS version info
        shell: bash
        run: |
          plutil -replace CFBundleShortVersionString -string "${VERSION}" iosApp/iosApp/Info.plist
          plutil -replace CFBundleVersion -string "${VERSION_CODE}" iosApp/iosApp/Info.plist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}

      - name: Set up iOS code signing and profiles
        shell: bash
        run: |
          if [[ -n "${IOS_PROVISIONING_PROFILE_BASE64}" && -n "${IOS_CERTIFICATE_BASE64}" ]]; then
            echo "Setting up iOS code signing..."
            
            # Decode certificate
            ios_cert_path="${RUNNER_TEMP}/ios-developer.p12"
            echo "${IOS_CERTIFICATE_BASE64}" | base64 --decode > "${ios_cert_path}"
            
            # Create a temporary keychain for iOS signing
            keychain_path="${RUNNER_TEMP}/ios-signing.keychain-db"
            security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
            security set-keychain-settings -lut 21600 "${keychain_path}"
            security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
            security import "${ios_cert_path}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
            security list-keychains -d user -s "${keychain_path}" login.keychain
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
            
            # Decode provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            profile_path="${HOME}/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
            echo "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile_path}"
            
            # Parse details from provisioning profile
            security cms -D -i "${profile_path}" > "${RUNNER_TEMP}/profile.plist"
            UUID=$(plutil -extract UUID raw "${RUNNER_TEMP}/profile.plist")
            TEAM_ID=$(plutil -extract TeamIdentifier.0 raw "${RUNNER_TEMP}/profile.plist")
            APPLICATION_ID=$(plutil -extract Entitlements.application-identifier raw "${RUNNER_TEMP}/profile.plist")
            BUNDLE_ID="${APPLICATION_ID#*.}" # Remove TEAM_ID prefix
            
            # Rename profile to its UUID name so Xcode finds it
            mv "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
            
            echo "Profile details:"
            echo "  UUID: ${UUID}"
            echo "  Team ID: ${TEAM_ID}"
            echo "  Bundle ID: ${BUNDLE_ID}"
            
            # Generate ExportOptions.plist
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>method</key>' \
              '    <string>development</string>' \
              '    <key>signingStyle</key>' \
              '    <string>manual</string>' \
              "    <key>teamID</key>" \
              "    <string>${TEAM_ID}</string>" \
              '    <key>provisioningProfiles</key>' \
              '    <dict>' \
              "        <key>${BUNDLE_ID}</key>" \
              "        <string>${UUID}</string>" \
              '    </dict>' \
              '</dict>' \
              '</plist>' > "${RUNNER_TEMP}/ExportOptions.plist"
            
            # Share variables to following steps
            echo "SIGN_IOS=true" >> "${GITHUB_ENV}"
            echo "IOS_TEAM_ID=${TEAM_ID}" >> "${GITHUB_ENV}"
            echo "IOS_PROVISIONING_PROFILE_UUID=${UUID}" >> "${GITHUB_ENV}"
          else
            echo "iOS signing secrets not fully provided. Building unsigned IPA."
            echo "SIGN_IOS=false" >> "${GITHUB_ENV}"
          fi
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build and Package iOS App
        shell: bash
        run: |
          if [[ "${SIGN_IOS}" == "true" ]]; then
            echo "Building signed iOS App..."
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "${RUNNER_TEMP}/ios-release-derived" \
              -archivePath "${RUNNER_TEMP}/iosApp.xcarchive" \
              DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
              PROVISIONING_PROFILE_SPECIFIER="${IOS_PROVISIONING_PROFILE_UUID}" \
              CODE_SIGN_STYLE="Manual" \
              archive

            xcodebuild -exportArchive \
              -archivePath "${RUNNER_TEMP}/iosApp.xcarchive" \
              -exportPath "${RUNNER_TEMP}/exported" \
              -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist"

            ipa_path="$(find "${RUNNER_TEMP}/exported" -name '*.ipa' -print -quit)"
            if [[ -z "${ipa_path}" ]]; then
              echo "::error::Could not find exported IPA file"
              exit 1
            fi
            mkdir -p release-artifacts
            cp "${ipa_path}" "release-artifacts/Phoebe-${VERSION}.ipa"
          else
            echo "Building unsigned iOS App..."
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "${RUNNER_TEMP}/ios-release-derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build

            app_path="$(find "${RUNNER_TEMP}/ios-release-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
            if [[ -z "${app_path}" ]]; then
              echo "::error::Could not find built iOS app"
              exit 1
            fi
            mkdir -p Payload
            cp -R "${app_path}" Payload/
            mkdir -p release-artifacts
            zip -r "release-artifacts/Phoebe-${VERSION}.ipa" Payload
            rm -rf Payload
          fi
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          if-no-files-found: error
          path: release-artifacts/*

  github-release:
    name: Create GitHub release
    needs:
      - version
      - android
      - linux
      - windows
      - macos
    if: always() && needs.version.result == 'success' && needs.android.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Phoebe ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.deb
            release-artifacts/**/*.flatpak
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
            release-artifacts/**/*.pkg

  attach-ios-release:
    name: Attach iOS to release
    needs:
      - version
      - ios
      - github-release
    if: always() && needs.ios.result == 'success' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: release-artifacts

      - name: Upload iOS IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          files: release-artifacts/**/*.ipa

  web-pages-deploy:
    name: Deploy web to GitHub Pages
    needs: version
    if: needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      PHOEBE_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_WEB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Validate web release secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${PHOEBE_GOOGLE_MAPS_WEB_API_KEY}" ]] || missing+=("PHOEBE_GOOGLE_MAPS_WEB_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required web release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build web bundle
        run: ./.github/scripts/gradle-wasm-retry.sh :composeApp:wasmJsBrowserDistribution

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          touch composeApp/build/dist/wasmJs/productionExecutable/.nojekyll
          cp composeApp/build/dist/wasmJs/productionExecutable/index.html \
            composeApp/build/dist/wasmJs/productionExecutable/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
