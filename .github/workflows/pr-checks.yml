name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-test:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux audio dependencies
        if: matrix.os == 'linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          ffmpeg
          xauth
          xvfb
          libgtk-3-0
          pulseaudio
          pulseaudio-utils
          libasound2-plugins
          gstreamer1.0-tools
          gstreamer1.0-pulseaudio
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly
          gstreamer1.0-libav

      - name: Start Linux virtual audio sink
        if: matrix.os == 'linux'
        run: bash ./scripts/setup-linux-audio-ci.sh

      - name: Install macOS ffmpeg
        if: matrix.os == 'macos'
        run: brew install ffmpeg

      - name: Fetch test audio fixtures
        if: matrix.os != 'windows'
        run: ./scripts/fetch-test-audio.sh

      - name: Run Linux desktop tests
        if: matrix.os == 'linux'
        env:
          GALLIUM_DRIVER: softpipe
        run: xvfb-run -a ./gradlew :composeApp:desktopTest -Pphoebe.realAudioTests=true

      - name: Run macOS desktop tests
        if: matrix.os == 'macos'
        run: ./gradlew :composeApp:desktopTest -Pphoebe.realAudioTests=true

      - name: Run Windows desktop tests
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./gradlew.bat :composeApp:desktopTest

      - name: Upload desktop test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-${{ matrix.os }}-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/tests/desktopTest/**
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/desktopTest/**

  android-screenshots:
    name: Android screenshots
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android screenshots
        run: ./gradlew :composeApp:verifyRoborazziAndroidHostTest

      - name: Upload Android screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/testAndroidHostTest/**

  desktop-screenshots:
    name: Desktop screenshots
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify desktop screenshots
        run: ./gradlew :composeApp:verifyRoborazziDesktop

      - name: Upload desktop screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/desktopTest/**

  ios-build:
    name: iOS build
    # Compose 1.11 links UIViewLayoutRegion (iOS 26 SDK); Xcode 16.x only supports deployment targets up to 18.5.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install Google Cast SDK
        run: ./scripts/install-ios-google-cast-sdk.sh

      - name: Build iOS app
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build

  web-screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web screenshot dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run web:install-browsers

      - name: Build wasm web bundle
        run: ./.github/scripts/gradle-wasm-retry.sh :composeApp:wasmJsBrowserDevelopmentWebpack

      - name: Verify web screenshots
        run: npm run web:screenshots

      - name: Run web E2E checks
        run: npm run web:e2e

      - name: Upload web screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/**
            test-results/**
            web-screenshot-tests/**/*-snapshots/**

  wasm-test:
    name: Wasm JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Run wasm JS tests
        run: ./.github/scripts/gradle-wasm-retry.sh :composeApp:wasmJsTest

  android-instrumented-tests:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch test audio fixtures
        run: ./scripts/fetch-test-audio.sh

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :composeApp:connectedAndroidDeviceTest -Pphoebe.realAudioTests=true

  web-preview-deploy:
    name: Deploy web preview to GitHub Pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_PREVIEW_DEPLOY_KEY: ${{ secrets.PAGES_PREVIEW_DEPLOY_KEY }}
      PAGES_PREVIEW_REPOSITORY: ${{ secrets.PAGES_PREVIEW_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Validate web preview deploy settings
        shell: bash
        run: |
          missing=()
          [[ -n "${PAGES_PREVIEW_DEPLOY_KEY}" ]] || missing+=("PAGES_PREVIEW_DEPLOY_KEY")
          [[ -n "${PAGES_PREVIEW_REPOSITORY}" ]] || missing+=("PAGES_PREVIEW_REPOSITORY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required web preview deploy settings: ${missing[*]}"
            exit 1
          fi

      - name: Build web bundle
        run: ./.github/scripts/gradle-wasm-retry.sh :composeApp:wasmJsBrowserDistribution

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${PAGES_PREVIEW_DEPLOY_KEY}" > "${HOME}/.ssh/preview_pages_key"
          ssh-keyscan github.com > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/preview_pages_key"

      - name: Deploy web preview bundle to preview Pages repository
        shell: bash
        run: |
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/preview_pages_key"
          repository_url="git@github.com:${PAGES_PREVIEW_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${repository_url}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${repository_url}" preview-pages
          else
            git clone "${repository_url}" preview-pages
            (
              cd preview-pages
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          rsync -a --delete --exclude .git \
            composeApp/build/dist/wasmJs/productionExecutable/ \
            preview-pages/
          touch preview-pages/.nojekyll
          cp preview-pages/index.html preview-pages/404.html
          printf 'phoebe-test.joetr.com\n' > preview-pages/CNAME

          (
            cd preview-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No preview Pages changes to deploy."
            else
              git commit -m "Deploy Phoebe preview from ${GITHUB_SHA}"
              git push origin gh-pages
            fi
          )

  backend-test:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure backend-only settings
        shell: bash
        run: cp settings.backend.gradle.kts settings.gradle.kts

      - name: Build and test backend
        run: ./gradlew :backend:app:test :backend:app:installDist
