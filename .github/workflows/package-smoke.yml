name: Package Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: package-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-package-playback-smoke:
    name: Desktop package playback smoke (${{ matrix.os }})
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux package smoke dependencies
        if: matrix.os == 'linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          dbus-x11
          fakeroot
          ffmpeg
          flatpak
          flatpak-builder
          xauth
          xvfb
          libgtk-3-0
          pulseaudio
          pulseaudio-utils
          libasound2-plugins
          gstreamer1.0-tools
          gstreamer1.0-pulseaudio
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly
          gstreamer1.0-libav

      - name: Install Flatpak runtime
        if: matrix.os == 'linux'
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Start Linux virtual audio sink
        if: matrix.os == 'linux'
        run: bash ./scripts/setup-linux-audio-ci.sh

      - name: Fetch test audio fixtures
        shell: bash
        run: bash ./scripts/fetch-test-audio.sh

      - name: Prepare Unix smoke fixture
        if: matrix.os != 'windows'
        shell: bash
        run: |
          smoke_dir="${HOME}/Downloads/phoebe-smoke"
          mkdir -p "${smoke_dir}"
          cp composeApp/src/commonTest/resources/test-audio/wikimedia-example.mp3 "${smoke_dir}/wikimedia-example.mp3"
          cp composeApp/src/commonTest/resources/test-audio/wikimedia-example.ogg "${smoke_dir}/wikimedia-example.ogg"
          if [[ -f composeApp/src/commonTest/resources/test-audio/wikimedia-example.wav ]]; then
            cp composeApp/src/commonTest/resources/test-audio/wikimedia-example.wav "${smoke_dir}/wikimedia-example.wav"
          fi
          smoke_fixture="${smoke_dir}/wikimedia-example.mp3"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            smoke_fixture="${smoke_dir}/wikimedia-example.ogg"
          fi
          {
            echo "PHOEBE_SMOKE_DIR=${smoke_dir}"
            echo "PHOEBE_SMOKE_FIXTURE=${smoke_fixture}"
            echo "PHOEBE_FLATPAK_SMOKE_FIXTURE=${smoke_dir}/wikimedia-example.wav"
          } >> "${GITHUB_ENV}"

      - name: Prepare Windows smoke fixture
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:USERPROFILE "Downloads\phoebe-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $smokeFixture = Join-Path $smokeDir "wikimedia-example.mp3"
          Copy-Item "composeApp\src\commonTest\resources\test-audio\wikimedia-example.mp3" $smokeFixture
          "PHOEBE_SMOKE_DIR=$smokeDir" >> $env:GITHUB_ENV
          "PHOEBE_SMOKE_FIXTURE=$smokeFixture" >> $env:GITHUB_ENV

      - name: Build Unix release distributable
        if: matrix.os != 'windows'
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Build Windows release distributable
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./gradlew.bat :composeApp:createReleaseDistributable

      - name: Smoke test release distributable playback
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          xvfb-run -a \
            composeApp/build/compose/binaries/main-release/app/Phoebe/bin/Phoebe \
            "--phoebe-playback-smoke=${PHOEBE_SMOKE_FIXTURE}" \
            --phoebe-playback-smoke-timeout-ms=20000 \
            2>&1 | tee smoke-logs/release-distributable.log

      - name: Smoke test macOS release app playback
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          composeApp/build/compose/binaries/main-release/app/Phoebe.app/Contents/MacOS/Phoebe \
            "--phoebe-playback-smoke=${PHOEBE_SMOKE_FIXTURE}" \
            --phoebe-playback-smoke-timeout-ms=20000 \
            2>&1 | tee smoke-logs/macos-release-app.log

      - name: Smoke test Windows release app playback
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "smoke-logs" | Out-Null
          $exe = "composeApp\build\compose\binaries\main-release\app\Phoebe\Phoebe.exe"
          & $exe "--phoebe-playback-smoke=$env:PHOEBE_SMOKE_FIXTURE" "--phoebe-playback-smoke-timeout-ms=20000" *> "smoke-logs\windows-release-app.log"
          $exitCode = $LASTEXITCODE
          Get-Content "smoke-logs\windows-release-app.log"
          exit $exitCode

      - name: Build and install Flatpak
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          (
            cd composeApp/flatpak
            flatpak-builder \
              --user \
              --force-clean \
              --install \
              "${GITHUB_WORKSPACE}/flatpak-build" \
              com.phoebe.app.yml
          ) 2>&1 | tee smoke-logs/flatpak-builder.log

      - name: Smoke test Flatpak playback
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a \
            flatpak run \
            --filesystem="${PHOEBE_SMOKE_DIR}:ro" \
            com.phoebe.app \
            "--phoebe-playback-smoke=${PHOEBE_FLATPAK_SMOKE_FIXTURE}" \
            --phoebe-playback-smoke-timeout-ms=20000 \
            2>&1 | tee smoke-logs/flatpak.log

      - name: Upload desktop package playback smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-playback-smoke-${{ matrix.os }}-artifacts
          if-no-files-found: ignore
          path: |
            smoke-logs/**
            composeApp/build/compose/logs/**

  android-package-playback-smoke:
    name: Android package playback smoke
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch test audio fixtures
        run: ./scripts/fetch-test-audio.sh

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Smoke test release APK playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke-test-android-release-apk.sh

      - name: Upload Android package playback smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-package-playback-smoke-artifacts
          if-no-files-found: ignore
          path: |
            smoke-logs/**

  ios-package-playback-smoke:
    name: iOS package playback smoke
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Google Cast SDK
        run: ./scripts/install-ios-google-cast-sdk.sh

      - name: Fetch test audio fixtures
        run: ./scripts/fetch-test-audio.sh

      - name: Select iOS simulator
        shell: bash
        run: |
          python3 - <<'PY' > "${RUNNER_TEMP}/ios-sim.env"
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, runtime_devices in devices["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in runtime_devices:
                  if device["name"].startswith("iPhone"):
                      print(f"SIM_UDID={device['udid']}")
                      print(f"SIM_NAME={device['name']}")
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          cat "${RUNNER_TEMP}/ios-sim.env" >> "${GITHUB_ENV}"
          cat "${RUNNER_TEMP}/ios-sim.env"

      - name: Build iOS simulator app
        shell: bash
        run: |
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=${SIM_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/ios-smoke-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Smoke test iOS simulator playback
        shell: bash
        run: |
          mkdir -p smoke-logs
          app="$(find "${RUNNER_TEMP}/ios-smoke-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ ! -d "${app}" ]]; then
            echo "::error::Could not find built iOS app"
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Info.plist")"
          xcrun simctl install "${SIM_UDID}" "${app}"
          container="$(xcrun simctl get_app_container "${SIM_UDID}" "${bundle_id}" data)"
          smoke_dir="${container}/Documents/phoebe-smoke"
          mkdir -p "${smoke_dir}"
          cp composeApp/src/commonTest/resources/test-audio/wikimedia-example.mp3 "${smoke_dir}/wikimedia-example.mp3"
          fixture="${smoke_dir}/wikimedia-example.mp3"
          stdout_log="${PWD}/smoke-logs/ios.stdout.log"
          stderr_log="${PWD}/smoke-logs/ios.stderr.log"

          xcrun simctl launch \
            --terminate-running-process \
            --stdout="${stdout_log}" \
            --stderr="${stderr_log}" \
            "${SIM_UDID}" \
            "${bundle_id}" \
            "--phoebe-playback-smoke=${fixture}" \
            --phoebe-playback-smoke-timeout-ms=30000

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            cat smoke-logs/ios.stdout.log smoke-logs/ios.stderr.log > smoke-logs/ios-playback-smoke.log 2>/dev/null || true
            if grep -q 'PHOEBE_PLAYBACK_SMOKE_OK' smoke-logs/ios-playback-smoke.log; then
              cat smoke-logs/ios-playback-smoke.log
              exit 0
            fi
            if grep -q 'PHOEBE_PLAYBACK_SMOKE_FAILED' smoke-logs/ios-playback-smoke.log; then
              cat smoke-logs/ios-playback-smoke.log
              exit 1
            fi
            sleep 1
          done
          cat smoke-logs/ios-playback-smoke.log || true
          echo "::error::Timed out waiting for iOS playback smoke result"
          exit 1

      - name: Upload iOS package playback smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-playback-smoke-artifacts
          if-no-files-found: ignore
          path: |
            smoke-logs/**

  web-production-playback-smoke:
    name: Web production playback smoke
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run web:install-browsers

      - name: Build production web bundle
        run: ./.github/scripts/gradle-wasm-retry.sh :composeApp:wasmJsBrowserDistribution

      - name: Smoke test production web playback
        env:
          PHOEBE_WEB_BASE_URL: http://127.0.0.1:8099
          PHOEBE_WEB_SERVER_COMMAND: node .github/scripts/serve-spa.mjs composeApp/build/dist/wasmJs/productionExecutable 8099 127.0.0.1
        run: npm run web:e2e:production

      - name: Upload web production playback smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-production-playback-smoke-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/**
            test-results/**
